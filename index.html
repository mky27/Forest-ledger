function closeModal(){modalMode='';editing=null;$('#modal').innerHTML='';document.body.style.overflow='';}
const selectOptions=(items,val)=>items.map(a=>`<option value="${esc(a.id)}" ${a.id===val?'selected':''}>${esc(a.emoji)} ${esc(a.name)}</option>`).join('');
function showTx(id=null,ct='expense',catId=null,force=false){editing=id;let t=db.transactions.find(x=>x.id===id);draftType=force?ct:(t?.type||ct);selectedCat=force?(draftType==='income'?'salary':'food'):(t?.category||catId||(draftType==='income'?'salary':'food'));const renderForm=()=>{const isTransfer=draftType==='transfer',isIncome=draftType==='income';const todayDate=t?.date||today();return `<div class="sheethead"><h2>${t?'修改记录':'记下一笔'}</h2><button class="close" data-act="close" aria-label="关闭">×</button></div><div class="segment"><button class="seg-btn ${draftType==='expense'?'on':''}" data-act="switch-tx" data-type="expense">支出</button><button class="seg-btn ${draftType==='income'?'on':''}" data-act="switch-tx" data-type="income">收入</button><button class="seg-btn ${isTransfer?'on':''}" data-act="switch-tx" data-type="transfer">转账</button></div><form id="tx-form"><div class="field"><label>金额</label><div class="amount-wrap"><span>RM</span><input id="tx-amount" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="0.00" value="${t?esc(t.amount):''}" required autofocus></div></div>${!isTransfer?`<div class="field"><label>${isIncome?'收入来源':'支出分类'}</label><div class="category-chooser">${cats(draftType).map(c=>`<button type="button" class="choice ${selectedCat===c.id?'on':''}" data-act="select-cat" data-id="${esc(c.id)}"><b>${esc(c.emoji)}</b>${esc(c.name)}</button>`).join('')}</div></div>`:''}<div class="field-grid"><div class="field"><label>${isTransfer?'转出账户':'使用账户'}</label><select name="account" id="tx-account" required>${selectOptions(db.accounts,t?.accountId||db.accounts[0]?.id)}</select></div>${isTransfer?`<div class="field"><label>转入账户</label><select id="tx-to" required>${selectOptions(db.accounts,t?.toAccountId||db.accounts[1]?.id||db.accounts[0]?.id)}</select></div>`:`<div class="field"><label>日期</label><input id="tx-date" type="date" value="${todayDate}" required></div>`}</div>${isTransfer?`<div class="field"><label>日期</label><input id="tx-date" type="date" value="${todayDate}" required></div>`:''}<div class="field"><label>备注（可选）</label><input id="tx-note" maxlength="80" placeholder="例如：午餐 / 房租 / 朋友转账" value="${esc(t?.note||'')}"></div><button type="submit" class="primary">${t?'保存修改':'保存这一笔'} ✓</button>${t?`<button type="button" data-act="delete-tx" class="danger-btn" style="width:100%;margin-top:10px">删除这笔记录</button>`:''}</form>`;};openModal(renderForm(),'tx');}
function showBudget(catId){editing=catId;let c=cat(catId);openModal(`<div class="sheethead"><h2>${esc(c.emoji)} ${esc(c.name)}预算</h2><button class="close" data-act="close">×</button></div><form id="budget-form"><div class="field"><label>每月预算上限（RM）</label><input id="budget-val" inputmode="decimal" type="number" min="0" step="0.01" value="${esc(db.budgets[catId]||'')}" placeholder="例如 500"></div><p class="smaller">设置为 0 可取消该分类预算。预算会持续用于每个月。</p><button class="primary" type="submit">保存预算</button></form>`,'budget');}
function showRule(id=null){editing=id;const r=db.recurring.find(r=>r.id===id);draftType=r?.type||'expense';selectedCat=r?.category||(draftType==='expense'?'subscription':'salary');const selectedA=r?.accountId||db.accounts[0]?.id;openModal(`<div class="sheethead"><h2>${r?'管理固定项目':'新增每月固定项目'}</h2><button class="close" data-act="close">×</button></div><div class="segment" style="grid-template-columns:1fr 1fr"><button class="seg-btn ${draftType==='expense'?'on':''}" data-act="switch-rule" data-type="expense">固定支出</button><button class="seg-btn ${draftType==='income'?'on':''}" data-act="switch-rule" data-type="income">固定收入</button></div><form id="rule-form"><div class="field"><label>项目名称</label><input id="rule-name" maxlength="70" required placeholder="例如：房租 / 电话费 / iCloud" value="${esc(r?.name||'')}"></div><div class="field-grid"><div class="field"><label>每月金额 RM</label><input id="rule-amount" type="number" inputmode="decimal" min="0.01" step="0.01" value="${esc(r?.amount||'')}" required placeholder="0.00"></div><div class="field"><label>每月扣款日</label><select id="rule-day">${Array.from({length:31},(_,i)=>`<option value="${i+1}" ${(r?.day||Number(today().slice(-2)))===i+1?'selected':''}>${i+1} 日</option>`).join('')}</select></div></div><div class="field-grid"><div class="field"><label>所属分类</label><select id="rule-cat">${selectOptions(cats(draftType),r?.category||selectedCat)}</select></div><div class="field"><label>扣款账户</label><select id="rule-account">${selectOptions(db.accounts,selectedA)}</select></div></div><div class="field-grid"><div class="field"><label>开始月份</label><input id="rule-start" type="month" value="${esc(r?.startMonth||today().slice(0,7))}" required></div><div class="field"><label>结束月份（可选）</label><input id="rule-end" type="month" value="${esc(r?.endMonth||'')}"></div></div>${r?`<div class="field row-between"><div><label style="margin:0 0 5px">启用自动记录</label><div class="smaller">暂停后将不再新增记录</div></div><button type="button" data-act="toggle-rule" class="toggle ${r.active?'on':''}" aria-label="暂停或启用固定项目"><i></i></button></div>`:''}<div class="notice">日期设为 29–31 日时，短月份自动改为当月最后一天。已产生的记录不会因为修改或暂停固定项目而被自动删除。</div><button class="primary" type="submit">${r?'保存固定项目':'添加并启用'} ✓</button>${r?`<button type="button" data-act="delete-rule" class="danger-btn" style="width:100%;margin-top:10px">删除此固定规则</button>`:''}</form>`,'rule');}
function showAccount(id=null){editing=id;const a=db.accounts.find(x=>x.id===id);openModal(`<div class="sheethead"><h2>${a?'管理账户':'新增账户'}</h2><button class="close" data-act="close">×</button></div><form id="account-form"><div class="field"><label>账户名称</label><input id="acc-name" maxlength="36" placeholder="例如 Maybank / Touch 'n Go" value="${esc(a?.name||'')}" required></div><div class="field-grid"><div class="field"><label>图标</label><select id="acc-emoji">${['🏦','💵','📲','💳','🏠','🪙','🌿','🐷'].map(e=>`<option value="${e}" ${a?.emoji===e?'selected':''}>${e}</option>`).join('')}</select></div><div class="field"><label>初始金额 RM</label><input type="number" id="acc-opening" inputmode="decimal" step="0.01" value="${esc(a?.opening||0)}" required></div></div><p class="smaller">现在的余额 = 初始金额 + 所有收入 − 所有支出。修改初始金额不会修改历史记账明细。</p><button class="primary" type="submit">保存账户</button>${a?`<button type="button" data-act="delete-account" class="danger-btn" style="width:100%;margin-top:10px">删除账户</button>`:''}</form>`,'account');}
function showCategory(){openModal(`<div class="sheethead"><h2>添加自定义分类</h2><button class="close" data-act="close">×</button></div><form id="category-form"><div class="field"><label>分类名称</label><input id="cat-name" maxlength="14" placeholder="例如：摄影器材" required></div><div class="field-grid"><div class="field"><label>记账类型</label><select id="cat-type"><option value="expense">支出</option><option value="income">收入</option></select></div><div class="field"><label>表情图标</label><select id="cat-emoji">${['🌱','📷','☕','🍰','🎮','👗','💻','🧸','💐','🎁','🧹','🛠️','💰','✨'].map(e=>`<option value="${e}">${e}</option>`).join('')}</select></div></div><button class="primary" type="submit">添加分类</button></form><p class="subhead">已有自定义分类</p>${db.customCats.length?db.customCats.map(c=>`<div class="row-between" style="padding:9px 0;border-bottom:1px solid var(--line)"><span>${esc(c.emoji)} ${esc(c.name)} <small style="color:#98a49a">${c.type==='expense'?'支出':'收入'}</small></span><button class="linkish" data-act="delete-cat" data-id="${esc(c.id)}">删除</button></div>`).join(''):'<p class="smaller" style="margin-top:11px">还没有自定义分类</p>'}`,'category');}
function download(name,blob){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);}
function exportJSON(){download(`森屿记账-完整备份-${today()}.json`,new Blob([JSON.stringify({...db,exportedAt:new Date().toISOString()},null,2)],{type:'application/json;charset=utf-8'}));toast('完整备份已导出，请存入 iCloud Drive');}
function exportCSV(){let rows=[['日期','类型','分类','金额(RM)','账户','转入账户','备注','固定规则']];db.transactions.slice().sort((a,b)=>b.date.localeCompare(a.date)).forEach(t=>rows.push([t.date,({expense:'支出',income:'收入',transfer:'转账'})[t.type]||'',t.type==='transfer'?'转账':cat(t.category).name,n(t.amount).toFixed(2),account(t.accountId).name,t.toAccountId?account(t.toAccountId).name:'',t.note||'',t.ruleId?'是':'否']));const content='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n');download(`森屿记账-明细-${today()}.csv`,new Blob([content],{type:'text/csv;charset=utf-8'}));toast('CSV 已导出');}
function confirmAction(message){return window.confirm(message);}
function saveForm(form){if(form==='tx-form'){const amount=n($('#tx-amount').value),acc=$('#tx-account').value,to=$('#tx-to')?.value||null,date=$('#tx-date').value;if(!Number.isFinite(amount)||amount<=0||amount>1e11)return toast('请输入正确金额');if(draftType==='transfer'&&acc===to)return toast('转出和转入不能是同一个账户');const old=db.transactions.find(x=>x.id===editing),entry={id:old?.id||uid(),type:draftType,amount:Math.round(amount*100)/100,category:draftType==='transfer'?'':selectedCat,accountId:acc,toAccountId:draftType==='transfer'?to:undefined,date,note:$('#tx-note').value.trim(),ruleId:old?.ruleId,createdAt:old?.createdAt||new Date().toISOString()};if(old)Object.assign(old,entry);else db.transactions.push(entry);persist();closeModal();render();toast(editing?'记录已修改':'记账成功，继续加油 🌿');return;}
if(form==='budget-form'){const val=n($('#budget-val').value);if(val<0)return toast('预算不能为负数');db.budgets[editing]=Math.round(val*100)/100;persist();closeModal();render();toast('分类预算已保存');return;}
if(form==='rule-form'){const amount=n($('#rule-amount').value),start=$('#rule-start').value,end=$('#rule-end').value;if(amount<=0||amount>1e11)return toast('请输入有效金额');if(end&&end<start)return toast('结束月份不能早于开始月份');const old=db.recurring.find(x=>x.id===editing),wasStart=old?.startMonth,wasDay=old?.day;const rule={id:old?.id||uid(),name:$('#rule-name').value.trim(),type:draftType,amount:Math.round(amount*100)/100,day:n($('#rule-day').value),category:$('#rule-cat').value,accountId:$('#rule-account').value,startMonth:start,endMonth:end||'',active:old?old.active:true,nextMonth:old?.nextMonth||start};if(!rule.name)return toast('请填写项目名称');if(old){if(start!==wasStart||rule.day!==wasDay){if(confirmAction('你更改了开始月份或扣款日。要从新的开始月份重新检查固定记录吗？\n已有记录不会重复生成。'))rule.nextMonth=start;}Object.assign(old,rule);}else db.recurring.push(rule);persist();closeModal();render();toast('固定项目已保存');return;}
if(form==='account-form'){const opening=Number($('#acc-opening').value);if(!Number.isFinite(opening)||Math.abs(opening)>1e11)return toast('初始金额无效');const a=db.accounts.find(x=>x.id===editing);const val={name:$('#acc-name').value.trim(),emoji:$('#acc-emoji').value,opening:Math.round(opening*100)/100};if(!val.name)return toast('请填写账户名称');if(a)Object.assign(a,val);else db.accounts.push({id:uid(),...val});persist();closeModal();render();toast('账户已保存');return;}
if(form==='category-form'){const name=$('#cat-name').value.trim();if(!name)return toast('请输入分类名称');db.customCats.push({id:uid(),name,emoji:$('#cat-emoji').value,tint:'#e6ede2',color:'#83a08b',type:$('#cat-type').value});persist();closeModal();render();toast('新分类已添加');return;}}
function go(p){page=p;searchText='';filter='all';render();}
function action(btn){const act=btn.dataset.act;if(act==='close'){closeModal();return;}if(act==='go-settings'){go('settings');return;}if(act==='open-ledger'){go('ledger');return;}if(act==='prev-month'||act==='next-month'){month=act==='prev-month'?ymPrev(month):ymNext(month);render();return;}if(act==='quick-cat'){showTx(null,'expense',btn.dataset.id);return;}if(act==='more-cats'){showTx();return;}if(act==='filter'){filter=btn.dataset.value;render();return;}if(act==='edit-tx'){showTx(btn.dataset.id);return;}if(act==='switch-tx'){const preserved={amount:$('#tx-amount')?.value||'',date:$('#tx-date')?.value||today(),note:$('#tx-note')?.value||'',account:$('#tx-account')?.value};draftType=btn.dataset.type;selectedCat=draftType==='income'?'salary':'food';const oldid=editing;showTx(oldid,draftType,null,true); // render the form in the new transaction mode
const inp=$('#tx-amount');if(inp)inp.value=preserved.amount;const date=$('#tx-date');if(date)date.value=preserved.date;const note=$('#tx-note');if(note)note.value=preserved.note;const a=$('#tx-account');if(a&&preserved.account)a.value=preserved.account;return;}
if(act==='select-cat'){selectedCat=btn.dataset.id;document.querySelectorAll('.choice').forEach(el=>el.classList.toggle('on',el.dataset.id===selectedCat));return;}
if(act==='delete-tx'){const t=db.transactions.find(x=>x.id===editing);if(t&&confirmAction('确定删除这笔记录吗？此操作不可撤销。')){db.transactions=db.transactions.filter(x=>x.id!==editing);persist();closeModal();render();toast('记录已删除');}return;}
if(act==='edit-budget'){showBudget(btn.dataset.id);return;}
if(act==='add-rule'){showRule();return;}
if(act==='edit-rule'){showRule(btn.dataset.id);return;}
if(act==='switch-rule'){const name=$('#rule-name')?.value||'',amount=$('#rule-amount')?.value||'',day=$('#rule-day')?.value||'',start=$('#rule-start')?.value||'',end=$('#rule-end')?.value||'',acc=$('#rule-account')?.value||'';const oldid=editing;showRule(oldid);draftType=btn.dataset.type;selectedCat=draftType==='expense'?'subscription':'salary';// swap the fields to the requested type without losing typed text
$('#rule-cat').innerHTML=selectOptions(cats(draftType),selectedCat);$('#rule-name').value=name;$('#rule-amount').value=amount;$('#rule-day').value=day;$('#rule-start').value=start;$('#rule-end').value=end;$('#rule-account').value=acc;document.querySelectorAll('#modal .seg-btn').forEach(el=>el.classList.toggle('on',el.dataset.type===draftType));return;}
if(act==='toggle-rule'){const r=db.recurring.find(x=>x.id===editing);if(!r)return;r.active=!r.active;if(r.active){const current=today().slice(0,7);const due=dueDate(current,r.day);const resume=due<today()?ymNext(current):current;r.nextMonth=resume<r.startMonth?r.startMonth:resume;}persist();showRule(editing);toast(r.active?'固定项目已启用':'固定项目已暂停');return;}
if(act==='delete-rule'){if(confirmAction('确定删除这条固定规则吗？已生成的记账记录会保留。')){db.recurring=db.recurring.filter(r=>r.id!==editing);persist();closeModal();render();toast('固定规则已删除');}return;}
if(act==='add-account'){showAccount();return;}
if(act==='edit-account'){showAccount(btn.dataset.id);return;}
if(act==='delete-account'){const id=editing;if(db.accounts.length<=1)return toast('至少需要保留一个账户');const used=db.transactions.some(t=>t.accountId===id||t.toAccountId===id)||db.recurring.some(r=>r.accountId===id);if(used)return toast('该账户有记账或固定项目，不能直接删除');if(confirmAction('确定删除这个没有交易的账户吗？')){db.accounts=db.accounts.filter(a=>a.id!==id);persist();closeModal();render();toast('账户已删除');}return;}
if(act==='export-json'){exportJSON();return;}if(act==='export-csv'){exportCSV();return;}if(act==='import-json'){$('#import-file').click();return;}
if(act==='add-category'){showCategory();return;}if(act==='delete-cat'){const id=btn.dataset.id;if(db.transactions.some(t=>t.category===id)||db.recurring.some(r=>r.category===id))return toast('此分类正在使用，无法删除');if(confirmAction('确定删除该分类？')){db.customCats=db.customCats.filter(c=>c.id!==id);persist();showCategory();}return;}
if(act==='reset'){if(confirmAction('确定清空所有记账、固定项目、预算和账户吗？建议先导出 JSON 备份。')&&confirmAction('再次确认：这将永久删除目前存在浏览器里的全部数据。')){db=initial();month=today().slice(0,7);persist();go('home');toast('已清空所有数据');}return;}}
document.addEventListener('click',e=>{const tab=e.target.closest('[data-page]');if(tab){go(tab.dataset.page);return;}const a=e.target.closest('[data-act]');if(a){action(a);return;}if(e.target.classList.contains('modal-shade'))closeModal();});
document.addEventListener('submit',e=>{if(['tx-form','budget-form','rule-form','account-form','category-form'].includes(e.target.id)){e.preventDefault();saveForm(e.target.id);}});
document.addEventListener('input',e=>{if(e.target.id==='search'){const pos=e.target.selectionStart;searchText=e.target.value;const rows=txMonthly().filter(t=>(filter==='all'||t.type===filter)&&(!searchText||(cat(t.category).name+' '+t.note+' '+account(t.accountId).name).toLowerCase().includes(searchText.toLowerCase()))).sort((a,b)=>b.date.localeCompare(a.date));let grouped={};rows.forEach(t=>(grouped[t.date]??=[]).push(t));const search=$('#search'),container=$('#ledger-results'); // full ledger render below search (without losing keyboard focus)
const pill=search?.closest('.filter-search')?.nextElementSibling;if(pill){let node=pill.nextElementSibling;while(node){const next=node.nextElementSibling;node.remove();node=next;}pill.insertAdjacentHTML('afterend',rows.length?Object.entries(grouped).map(([d,items])=>`<div class="date-group">${dateLabel(d)}</div>${txList(items)}`).join(''):txList([]));} } });
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modalMode)closeModal();});
$('#fab').addEventListener('click',()=>showTx());
$('#import-file').addEventListener('change',async e=>{const file=e.target.files?.[0];e.target.value='';if(!file)return;try{const parsed=JSON.parse(await file.text());if(!parsed||!Array.isArray(parsed.accounts)||!Array.isArray(parsed.transactions)||!Array.isArray(parsed.recurring)||!parsed.accounts.length)throw Error('不是有效的森屿记账备份');if(!confirmAction(`即将导入 ${parsed.transactions.length} 笔记录并覆盖当前所有数据。确定继续吗？`))return;db={...initial(),...parsed,budgets:parsed.budgets||{},customCats:parsed.customCats||[]};persist();month=today().slice(0,7);go('home');toast('备份恢复成功');}catch(err){toast('导入失败：文件格式有误');}});
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
render();
})();
</script>
</body>
</html>
